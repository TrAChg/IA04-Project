<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analytics - Africa Sim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand text-primary fw-bold" href="index.html">Africa Sim</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="history.html">Histories</a></li>
                <li class="nav-item"><a class="nav-link" href="countries.html">Countries Data</a></li>
            </ul>
            <span class="navbar-text text-white fw-bold me-3" id="globalStatus">OFFLINE</span>
            <span class="badge bg-secondary fs-6" id="tourDisplay">Tour: 0</span>
        </div>
    </div>
</nav>

<div class="container">
    <h3 class="mb-3 text-secondary">Simulation Trends Analysis ( Get from /history in api.go ) </h3>
    
    <div class="card shadow-sm mb-4">
        <div class="card-header fw-bold">Population vs Deaths Over Time</div>
        <div class="card-body">
            <div style="height: 350px;">
                <canvas id="popChart"></canvas>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm mb-4">
                <div class="card-header fw-bold">Land Loss</div>
                <div class="card-body">
                    <div style="height: 300px;">
                        <canvas id="landChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm mb-4">
                <div class="card-header fw-bold">Border Policies (Open vs Closed)</div>
                <div class="card-body">
                    <div style="height: 300px;">
                        <canvas id="borderChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/sea.js"></script>
</body>
</html>
