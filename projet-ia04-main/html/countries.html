<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Countries Data - Africa Sim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand text-primary fw-bold" href="index.html">Africa Sim</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="history.html">Analytics (Charts)</a></li>
                <li class="nav-item"><a class="nav-link active" href="countries.html">Countries Data</a></li>
            </ul>
            <span class="navbar-text text-white fw-bold me-3" id="globalStatus">OFFLINE</span>
            <span class="badge bg-secondary fs-6" id="tourDisplay">Tour: 0</span>
        </div>
    </div>
</nav>

<div class="container">
    <h3 class="mb-3 text-secondary">Detailed Country Statistics ( Get from /countries in api.go )</h3>
    
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th># Rank</th>
                            <th>Country Name</th>
                            <th>Population</th>
                            <th>Max Capacity</th>
                            <th>Load (%)</th>
                            <th>Literate</th>
                            <th>Non-Lit</th>
                            <th>Illegal</th>
                            <th>Indicator</th>
                            <th>Deaths</th>
                            <th>Border</th>
                        </tr>
                    </thead>
                    <tbody id="countryTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="js/sea.js"></script>
</body>
</html>
